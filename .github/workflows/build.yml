name: Build & Release Windows Single Binary

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build:
    name: Compile Single Binary (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download Dependencies
        run: go mod tidy

      - name: Resolve Version Metadata
        id: meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $ver = $env:GITHUB_REF_NAME
          } else {
            $short = $env:GITHUB_SHA.Substring(0, 7)
            $ver = "v0.0.0-$short"
          }
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "commit=$($env:GITHUB_SHA.Substring(0, 7))" >> $env:GITHUB_OUTPUT
          echo "build_date=$date" >> $env:GITHUB_OUTPUT

      - name: Build Executables (x64 & arm64)
        env:
          CGO_ENABLED: '0'
          GOOS: 'windows'
        shell: pwsh
        run: |
          $ldflags = "-H=windowsgui -s -w -X elearning-sbt/version.Version=${{ steps.meta.outputs.version }} -X elearning-sbt/version.Commit=${{ steps.meta.outputs.commit }} -X elearning-sbt/version.BuildDate=${{ steps.meta.outputs.build_date }}"
          $env:GOARCH = "amd64"
          go build -ldflags="$ldflags" -o LearnChain.exe .
          Copy-Item LearnChain.exe LearnChain-x64.exe
          $env:GOARCH = "arm64"
          go build -ldflags="$ldflags" -o LearnChain-arm64.exe .

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          @("LearnChain.exe", "LearnChain-x64.exe", "LearnChain-arm64.exe") | ForEach-Object {
            $hash = (Get-FileHash -Path $_ -Algorithm SHA256).Hash.ToLower()
            "$hash  $_"
          } | Out-File -FilePath checksums.txt -Encoding ascii

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: learnchain-windows-${{ steps.meta.outputs.version }}
          path: |
            LearnChain.exe
            LearnChain-x64.exe
            LearnChain-arm64.exe
            checksums.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            LearnChain.exe
            LearnChain-x64.exe
            LearnChain-arm64.exe
            checksums.txt
